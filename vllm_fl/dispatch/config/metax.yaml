# K3 MetaX: open operators with explicit failure, no vendor framework backend.
prefer: flagos
strict: true
deny_vendors:
  - metax
  - maca
op_backends:
  dynamic_per_token_quant_int8: [flagos]
  silu_and_mul: [flagos]
  gelu_and_mul: [flagos]
  rms_norm: [flagos]
  rotary_embedding: [flagos]
  attention_backend: [flagos]
  moe_align_block_size: [flagos]
  moe_sum: [flagos]
  topk_softmax: [flagos]
  invoke_fused_moe_triton_kernel: [flagos]
  grouped_topk: [flagos]
# Retained upstream per-ATen exclusions; they do not enable vendor framework ops.
flagos_blacklist:
  - masked_fill
  - masked_fill_
oot_blacklist:
  - masked_fill
  - masked_fill_
